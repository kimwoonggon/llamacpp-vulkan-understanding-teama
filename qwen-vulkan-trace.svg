<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 868" width="1260" height="868" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#465c70" /></marker></defs><rect width="1260" height="868" fill="#f5f8fa" /><text x="36" y="46" fill="#172d43" font-family="Malgun Gothic, sans-serif" font-size="32" font-weight="700">Qwen2.5   /   F5에서 다음 토큰까지</text><text x="36" y="78" fill="#172d43" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400">RTX 2070 SUPER  ·  첫 층 FFN up projection  ·  화살표는 데이터와 실행의 진행 순서</text><text x="36" y="116" fill="#175a83" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="700">SS   /   입력</text><rect x="36" y="128" width="350" height="98" rx="12" fill="white" stroke="#175a83" stroke-width="2" /><text x="54" y="156" fill="#175a83" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="700">Visual Studio · main</text><text x="54" y="184" fill="#172d43" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400">-m &lt;GGUF&gt;   -ngl 99</text><text x="54" y="209" fill="#415667" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400">llama-simple 디버깅 인수</text><rect x="455" y="128" width="350" height="98" rx="12" fill="white" stroke="#175a83" stroke-width="2" /><text x="473" y="156" fill="#175a83" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="700">모델 로드</text><text x="473" y="184" fill="#172d43" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400">llama_model_load_from_file</text><text x="473" y="209" fill="#415667" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400">Qwen2 가중치 · 어휘 · 레이어 배치</text><rect x="874" y="128" width="350" height="98" rx="12" fill="white" stroke="#175a83" stroke-width="2" /><text x="892" y="156" fill="#175a83" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="700">첫 배치</text><text x="892" y="184" fill="#172d43" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400">llama_tokenize → llama_decode</text><text x="892" y="209" fill="#415667" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400">보고용 프롬프트 13토큰</text><text x="36" y="284" fill="#206951" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="700">HR   /   Qwen2 그래프</text><rect x="36" y="296" width="350" height="98" rx="12" fill="white" stroke="#206951" stroke-width="2" /><text x="54" y="324" fill="#206951" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="700">스케줄러에 실행 요청</text><text x="54" y="352" fill="#172d43" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400">graph_compute → scheduler</text><text x="54" y="377" fill="#415667" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400">입력 설정 후 그래프 구간별로 실행</text><rect x="455" y="296" width="350" height="98" rx="12" fill="white" stroke="#206951" stroke-width="2" /><text x="473" y="324" fill="#206951" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="700">GGML_OP_MUL_MAT</text><text x="473" y="352" fill="#172d43" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400">ggml_mul_mat(W, X)</text><text x="473" y="377" fill="#415667" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400">ffn_up-0 · 입력과 가중치 참조 저장</text><rect x="874" y="296" width="350" height="98" rx="12" fill="white" stroke="#206951" stroke-width="2" /><text x="892" y="324" fill="#206951" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="700">Qwen2 그래프 생성 또는 재사용</text><text x="892" y="352" fill="#172d43" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400">process_ubatch → build_graph</text><text x="892" y="377" fill="#415667" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400">새 그래프에서 build_ffn → build_lora_mm</text><text x="36" y="452" fill="#8b402f" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="700">WG   /   Vulkan 백엔드</text><rect x="36" y="464" width="350" height="98" rx="12" fill="white" stroke="#8b402f" stroke-width="2" /><text x="54" y="492" fill="#8b402f" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="700">백엔드 경계</text><text x="54" y="520" fill="#172d43" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400">split_backend → iface.graph_compute</text><text x="54" y="545" fill="#415667" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400">Vulkan 구간이 Vulkan 구현으로 진입</text><rect x="455" y="464" width="350" height="98" rx="12" fill="white" stroke="#8b402f" stroke-width="2" /><text x="473" y="492" fill="#8b402f" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="700">연산 분기</text><text x="473" y="520" fill="#172d43" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400">ggml_vk_mul_mat</text><text x="473" y="545" fill="#415667" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400">자료형 · 배치 · 장치에 맞는 구현 선택</text><rect x="874" y="464" width="350" height="98" rx="12" fill="white" stroke="#8b402f" stroke-width="2" /><text x="892" y="492" fill="#8b402f" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="700">명령 기록과 제출</text><text x="892" y="520" fill="#172d43" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400">bindPipeline → dispatch → submit</text><text x="892" y="545" fill="#415667" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400">큐에서 선택된 compute shader 실행</text><text x="36" y="650" fill="#175a83" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="700">GPU 계산   /   출력</text><rect x="36" y="662" width="350" height="98" rx="12" fill="white" stroke="#175a83" stroke-width="2" /><text x="54" y="690" fill="#175a83" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="700">다음 토큰 출력</text><text x="54" y="718" fill="#172d43" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400">greedy → token_to_piece → printf</text><text x="54" y="743" fill="#415667" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400">새 토큰 1개를 다음 decode에 입력</text><rect x="455" y="662" width="350" height="98" rx="12" fill="white" stroke="#175a83" stroke-width="2" /><text x="473" y="690" fill="#175a83" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="700">나머지 층과 출력 투영</text><text x="473" y="718" fill="#172d43" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400">result_output → logits</text><text x="473" y="743" fill="#415667" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400">어휘별 점수를 sampler에 전달</text><rect x="874" y="662" width="350" height="98" rx="12" fill="white" stroke="#175a83" stroke-width="2" /><text x="892" y="690" fill="#175a83" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="700">ffn_up-0의 두 실행</text><text x="892" y="718" fill="#172d43" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400">13토큰   mul_mm.comp 계열</text><text x="892" y="743" fill="#415667" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400">1토큰     mul_mat_vec.comp 계열</text><path d="M386 177 H449" fill="none" stroke="#465c70" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M805 177 H868" fill="none" stroke="#465c70" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M386 513 H449" fill="none" stroke="#465c70" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M805 513 H868" fill="none" stroke="#465c70" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M874 345 H811" fill="none" stroke="#465c70" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M455 345 H392" fill="none" stroke="#465c70" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M874 711 H811" fill="none" stroke="#465c70" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M455 711 H392" fill="none" stroke="#465c70" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M1049 226 V290" fill="none" stroke="#465c70" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M211 394 V458" fill="none" stroke="#465c70" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M1049 562 V656" fill="none" stroke="#465c70" stroke-width="2.5" marker-end="url(#arrow)" /><text x="36" y="810" fill="#172d43" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700">13토큰  ·  matmul_f16_f32_f16acc_aligned_0   (280, 1, 1)        /        1토큰  ·  mul_mat_vec_f16_f32_f32   (4480, 1, 1)</text><text x="36" y="840" fill="#172d43" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400">괄호는 dispatch 작업 그룹 수. 그래프가 재사용되는 회차에는 노드 생성 단계를 건너뛴다.</text></svg>